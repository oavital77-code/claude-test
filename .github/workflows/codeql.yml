# סריקת קוד אבטחה (CodeQL) — מחפשת חולשות בקוד עצמו: הזרקות, XSS, דליפת
# מידע, שימוש לא בטוח בקלט. רצה על כל PR ל-master, על כל מיזוג, ופעם בשבוע
# (חולשות חדשות מתווספות לכללים גם כשהקוד לא השתנה). תוצאות: לשונית
# Security → Code scanning בגיטהאב.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 4 * * 0" # יום ראשון 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
